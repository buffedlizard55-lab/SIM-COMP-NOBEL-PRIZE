name: Collect Kalshi and simulate

on:
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * *"
  push:
    branches:
      - arena/01a0d45e-sim-comp-nobel-prize
      - arena/01a0d49f-sim-comp-nobel-prize
      - main
    paths:
      - "simcomp/**"
      - "scripts/**"
      - ".github/workflows/collect-kalshi.yml"

permissions:
  contents: write

concurrency:
  group: collect-kalshi
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect public Kalshi data and simulate
        run: python scripts/refresh.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-sim-data
          path: |
            data/kalshi
            data/sim
            docs/RESEARCH.md
          if-no-files-found: warn

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kalshi data/sim docs/RESEARCH.md
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update Kalshi snapshot and simulated competition [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
